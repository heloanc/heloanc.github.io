<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 255" role="img" aria-labelledby="title desc"><title id="title">RSI teacher executor verifier loop</title><desc id="desc">The teacher edits code and prompts. The frozen executor runs cases. The verifier analyzes feedback and updates experience. Validation selects an archived version.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#567c68"/></marker></defs><rect width="320" height="255" rx="3" fill="#f9fbf7"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="160" y="28" font-size="10" letter-spacing="2" fill="#7d8e7d">EXECUTION-GROUNDED EVOLUTION</text><g stroke="#c5d7c7" fill="#fff"><rect x="25" y="50" width="112" height="56" rx="4"/><rect x="183" y="50" width="112" height="56" rx="4"/><rect x="102" y="151" width="116" height="56" rx="4"/></g><g fill="#284c3a" font-size="14"><text x="81" y="73">Teacher</text><text x="239" y="73">Executor</text><text x="160" y="174">Verifier</text></g><g fill="#778376" font-size="10"><text x="81" y="92">Code + prompts</text><text x="239" y="92">Frozen revision</text><text x="160" y="193">Traces + outcomes</text></g><g fill="none" stroke="#567c68" stroke-width="1.4" marker-end="url(#arrow)"><path d="M139 78H179"/><path d="M239 108V130L204 148"/><path d="M100 179H70V110"/></g><text x="60" y="150" font-size="9" fill="#6b826d" transform="rotate(-90 60 150)">experience</text><path d="M160 209V224" stroke="#9aaf9c" stroke-dasharray="3 3"/><text x="160" y="241" font-size="10" fill="#637e69">Archive → validation → selected agent</text></g></svg>
